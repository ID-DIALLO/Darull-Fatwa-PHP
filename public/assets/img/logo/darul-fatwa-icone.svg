<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512" role="img" aria-label="Darul Fatwa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Darul Fatwa – icône</title>
  <rect width="240" height="240" rx="44" fill="#F7F1E1"/>
  <g transform="translate(120 120) scale(.9) translate(-120 -110)">
  <defs>
    <linearGradient id="igArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7356"/>
      <stop offset="1" stop-color="#073D2E"/>
    </linearGradient>
    <linearGradient id="igGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C77E"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <mask id="imCrescent">
      <rect x="96" y="-10" width="48" height="48" fill="#fff"/>
      <circle cx="120" cy="9.5" r="8.2" fill="#000"/>
    </mask>
  </defs>
  <!-- Croissant au sommet -->
  <circle cx="120" cy="14" r="10" fill="url(#igGold)" mask="url(#imCrescent)"/>
  <rect x="118.6" y="22" width="2.8" height="9" rx="1.2" fill="#C9A24B"/>
  <!-- Arche / Dôme -->
  <path d="M46 214 V112 C46 72 82 50 120 30 C158 50 194 72 194 112 V214 Z"
        fill="url(#igArch)" stroke="#C9A24B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M58 206 V114 C58 81 89 62 120 45 C151 62 182 81 182 114 V206"
        fill="none" stroke="#E3C77E" stroke-opacity=".55" stroke-width="1.6"/>
  <!-- Étoile à 8 branches (Rub el Hizb) -->
  <g transform="translate(120 74)" fill="none" stroke="#E3C77E" stroke-width="1.8">
    <rect x="-8" y="-8" width="16" height="16"/>
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)"/>
    <circle r="2.6" fill="#E3C77E" stroke="none"/>
  </g>
  <!-- Ondes vocales -->
  <g fill="url(#igGold)">
    <rect x="77.5"  y="132" width="7" height="12" rx="3.5"/>
    <rect x="90.5"  y="122" width="7" height="22" rx="3.5"/>
    <rect x="103.5" y="110" width="7" height="34" rx="3.5"/>
    <rect x="116.5" y="98"  width="7" height="46" rx="3.5"/>
    <rect x="129.5" y="110" width="7" height="34" rx="3.5"/>
    <rect x="142.5" y="122" width="7" height="22" rx="3.5"/>
    <rect x="155.5" y="132" width="7" height="12" rx="3.5"/>
  </g>
  <!-- Livre ouvert (Coran) -->
  <path d="M64 160 V197 C84 192 104 194 120 203 C136 194 156 192 176 197 V160"
        fill="none" stroke="url(#igGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 165 C106 155 88 152 71 156 V190 C88 186 106 188 120 197 Z" fill="#F7F1E1"/>
  <path d="M120 165 C134 155 152 152 169 156 V190 C152 186 134 188 120 197 Z" fill="#EFE4C6"/>
  <path d="M120 165 V197" stroke="#C9A24B" stroke-width="1.6"/>
  <g stroke="#C9A24B" stroke-opacity=".7" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M79 166 C91 164 102 166 112 171"/>
    <path d="M79 174 C91 172 102 174 112 179"/>
    <path d="M79 182 C91 180 102 182 112 187"/>
    <path d="M161 166 C149 164 138 166 128 171"/>
    <path d="M161 174 C149 172 138 174 128 179"/>
    <path d="M161 182 C149 180 138 182 128 187"/>
  </g></g>
</svg>
